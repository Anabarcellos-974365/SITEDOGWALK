<body class="bg-background text-on-background font-body-md overflow-x-hidden min-h-screen">
<!-- Top Navigation Bar -->
<header class="flex justify-between items-center px-4 py-3 w-full fixed top-0 z-50 bg-primary shadow-md">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-on-primary">pets</span>
<h1 class="font-headline-md text-on-primary font-bold tracking-tight">DogWalk Brasília</h1>
</div>
<div class="flex items-center gap-4">
<a class="text-primary-fixed-dim hover:text-on-primary font-label-md transition-colors" href="#">Entrar</a>
<span class="material-symbols-outlined text-on-primary">account_circle</span>
</div>
</header>
<!-- Main Content: Registration Hero -->
<main class="relative min-h-screen flex items-center justify-center pt-16 pb-12 md:pb-0">
<!-- Background Image Container -->
<div class="absolute inset-0 z-0 overflow-hidden">
<img alt="A young man walking a happy golden retriever in a sun-drenched public park in Brasília. The scene is filled with warm, golden-hour light filtering through trees, creating a serene and professional atmosphere. The visual style is clean and high-fidelity, matching a corporate modern aesthetic with soft greens and earthy tones." class="w-full h-full object-cover" data-alt="A young man walking a happy golden retriever in a sun-drenched public park in Brasília. The scene is filled with warm, golden-hour light filtering through trees, creating a serene and professional atmosphere. The visual style is clean and high-fidelity, matching a corporate modern aesthetic with soft greens and earthy tones. The lighting is high-key and inviting, reinforcing a pet-first service brand identity." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAGaur4uVJA99mQfcmuB1qmieXYknut9_hcBI_BGotUVO77NzV9fQPAHXEyJ68u2SRDxWLfL1ZT7zVfJTEf7D1oxMkDQgzR2Qb70ueBrapE9FOPa-REInHVm5R5mhE4liehV7D-VUSn-CyWJQiMV2kGQSszyG0Nh7nkbqOHz9uMSPrIOJL5SW6pNwgXtmw_CEnyGDm4ZF9qaZ8Nx4xqLP-Urf1TBagIjPuEuXFhCWyG-G5CSr2bnTEXjw-1gDmpj3oe8bsoXzo2VHTI"/>
<div class="absolute inset-0 bg-black/10"></div>
</div>
<!-- Registration Card Container -->
<div class="relative z-10 w-full max-w-xl mx-4 my-8">
<div class="glass-panel border border-outline-variant rounded-xl p-8 md:p-10 shadow-xl">
<!-- Brand Anchor Silhoutte -->
<div class="absolute top-4 right-4 text-primary/20 opacity-30">
<span class="material-symbols-outlined text-6xl" style="font-variation-settings: 'FILL' 1;">pets</span>
</div>
<div class="mb-8">
<h2 class="font-headline-lg text-primary mb-2">Criar Conta</h2>
<p class="text-on-surface-variant font-body-md">Junte-se à nossa comunidade de amantes de pets em Brasília.</p>
</div>
<form class="space-y-5">
<!-- Nome Completo -->
<div class="space-y-1">
<label class="block font-label-md text-on-surface" for="name">Nome completo</label>
<input class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none" id="name" placeholder="Como devemos chamar você?" type="text"/>
</div>
<!-- E-mail -->
<div class="space-y-1">
<label class="block font-label-md text-on-surface" for="email">E-mail</label>
<input class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none" id="email" placeholder="seu@email.com" type="email"/>
</div>
<!-- Grid for Password and Confirm -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="space-y-1">
<label class="block font-label-md text-on-surface" for="password">Senha</label>
<input class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none" id="password" placeholder="••••••••" type="password"/>
</div>
<div class="space-y-1">
<label class="block font-label-md text-on-surface" for="confirm_password">Confirmação</label>
<input class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none" id="confirm_password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Telefone -->
<div class="space-y-1">
<label class="block font-label-md text-on-surface" for="phone">Telefone</label>
<input class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none" id="phone" placeholder="(61) 00000-0000" type="tel"/>
</div>
<!-- Endereço Completo -->
<div class="space-y-1">
<label class="block font-label-md text-on-surface" for="address">Endereço completo</label>
<textarea class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none resize-none" id="address" placeholder="Ex: SQS 305, Bloco A, Brasília - DF" rows="2"></textarea>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start gap-3 py-2">
<div class="flex items-center h-5">
<input class="w-5 h-5 text-primary border-outline-variant rounded focus:ring-primary transition-all" id="terms" type="checkbox"/>
</div>
<label class="text-label-sm text-on-surface-variant leading-tight" for="terms">
                            Eu aceito os <a class="text-primary underline font-bold" href="#">termos e serviços</a> e a política de privacidade da DogWalk Brasília.
                        </label>
</div>
<!-- Primary Action Button -->
<button class="w-full py-4 bg-primary text-on-primary font-bold rounded-xl shadow-lg hover:brightness-110 active:scale-[0.98] transition-all transform duration-150 flex items-center justify-center gap-2" type="submit">
                        CADASTRAR
                        <span class="material-symbols-outlined">arrow_forward</span>
</button>
<!-- Back Link -->
<div class="text-center pt-2">
<a class="text-on-surface-variant font-label-md hover:text-primary transition-colors flex items-center justify-center gap-1" href="#">
<span class="material-symbols-outlined text-sm">arrow_back</span>
                            Voltar para o login
                        </a>
</div>
</form>
</div>
</div>
</main>
<!-- Footer -->
<footer class="w-full py-8 px-4 flex flex-col items-center gap-4 bg-surface-container-highest border-t border-outline-variant relative z-10">
<div class="font-headline-md text-primary font-black">DogWalk Brasília</div>
<div class="flex flex-wrap justify-center gap-6">
<a class="text-on-surface-variant font-label-sm hover:text-primary transition-colors" href="#">Privacidade</a>
<a class="text-on-surface-variant font-label-sm hover:text-primary transition-colors" href="#">Termos</a>
<a class="text-on-surface-variant font-label-sm hover:text-primary transition-colors" href="#">Suporte</a>
<a class="text-on-surface-variant font-label-sm hover:text-primary transition-colors" href="#">Trabalhe Conosco</a>
</div>
<p class="font-label-sm text-on-surface-variant opacity-80">© 2024 DogWalk Brasília. Cuidando com carinho.</p>
</footer>
<!-- Bottom Nav for Mobile -->
<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center bg-surface px-2 pb-safe pt-2 border-t border-outline-variant shadow-[0_-2px_10px_rgba(0,0,0,0.05)] rounded-t-xl">
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary p-2">
<span class="material-symbols-outlined">home</span>
<span class="text-label-sm font-label-sm">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary p-2">
<span class="material-symbols-outlined">search</span>
<span class="text-label-sm font-label-sm">Serviços</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary p-2">
<span class="material-symbols-outlined">calendar_month</span>
<span class="text-label-sm font-label-sm">Agenda</span>
</button>
<button class="flex flex-col items-center justify-center text-primary font-bold bg-primary-container/30 rounded-full px-3 py-1">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="text-label-sm font-label-sm">Perfil</span>
</button>
</nav>
<script>
        // Micro-interaction for form inputs
        const inputs = document.querySelectorAll('input, textarea');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.01]');
            });
        });

        // Simple button active state effect
        const btn = document.querySelector('button[type="submit"]');
        btn.addEventListener('mousedown', () => btn.classList.add('scale-95'));
        btn.addEventListener('mouseup', () => btn.classList.remove('scale-95'));
    </script>
</body></html>
